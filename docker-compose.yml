version: '3.8'

services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - TRYFIT_INFERENCE_MODE=mock
      - DATABASE_URL=postgresql://tryfit_user:tryfit_pass@postgres:5432/tryfit_db
      - REDIS_URL=redis://redis:6379/0
      - OBJECT_STORAGE_ENDPOINT=http://minio:9000
    depends_on:
      - postgres
      - redis
      - minio

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tryfit_user
      POSTGRES_PASSWORD: tryfit_pass
      POSTGRES_DB: tryfit_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:RELEASE.2024-01-31T20-20-33Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: tryfit_admin
      MINIO_ROOT_PASSWORD: tryfit_storage_secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  minio_data:
